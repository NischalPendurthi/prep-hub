<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../shared/hub.css">
<script src="../shared/hub.js" data-tool="applications"></script>
<title>Applications</title>
<meta name="description" content="Track the companies and roles you applied to, with a status for each one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235f3dc4'/%3E%3Cpath d='M8 12h16v11H8zM13 12V9h6v3' stroke='white' stroke-width='2.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="hubbar" id="hubbar"></nav>
<main class="wrap">
  <h1>Applications</h1>

  <form class="add" id="add" novalidate>
    <label>Company <input id="company" name="company" autocomplete="off" maxlength="200" required></label>
    <label>Role <input id="role" name="role" autocomplete="off" maxlength="300" required></label>
    <button type="submit">Add</button>
    <p class="msg" id="msg" role="alert" hidden></p>
  </form>

  <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden></p>

  <footer>
    <span>Saved in this browser only.</span>
    <button type="button" id="export">Export</button>
    <button type="button" id="import">Import</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
