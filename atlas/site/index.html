<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../shared/hub.css">
<script src="../shared/hub.js" data-tool="atlas" data-toggle="#theme-btn"></script>
<title>CP Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Cpath d='M9 22l7-12 7 12M12 17h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/hl-light.min.css" id="hl-light">
<link rel="stylesheet" href="vendor/hl-dark.min.css" id="hl-dark" disabled>
<link rel="stylesheet" href="style.css">
<script>
  // apply the saved theme before first paint
  try { var t = localStorage.getItem('atlas-theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
</script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<nav class="hubbar" id="hubbar"></nav>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open topics">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">CP&nbsp;Atlas</a>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="home">Home</a>
    <a href="#/map" data-tab="map">Map</a>
    <a href="#/log" data-tab="log">Log</a>
    <a href="#/revise" data-tab="revise">Revise <span class="pill" id="due-pill" hidden></span></a>
  </nav>
  <button class="search-btn" id="search-btn" aria-label="Search">
    <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="search-label">Search</span><kbd>Ctrl K</kbd>
  </button>
  <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <input class="side-filter" id="side-filter" type="search" placeholder="Filter topics…" aria-label="Filter topics">
    <nav id="tree"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<div class="search-overlay" id="search" hidden>
  <div class="search-box" role="dialog" aria-label="Search">
    <input id="search-input" type="search" placeholder="Search variants, signals, your problems…" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
