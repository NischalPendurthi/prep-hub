name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Verify only the guides whose files changed since the last successful deploy.
      # Diffing against that deploy (not the previous push) keeps cancelled runs from skipping anything.
      - name: Work out what changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --workflow pages.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          if [[ "${{ github.event_name }}" != push || -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base: verifying everything"
            files=ALL
          else
            files=$(git diff --name-only "$base" HEAD)
            echo "changed since $base:"; echo "$files"
          fi
          has() { [[ "$files" == ALL ]] || grep -qE "$1" <<<"$files"; }
          atlas=false; langs=false; topics=false
          has '^\.github/workflows/' && files=ALL
          has '^atlas/' && atlas=true
          has '^langs/' && langs=true
          has '^(topics/|langs/(build\.mjs|reader/|toolchains\.json))' && topics=true
          any=false; [[ $atlas == true || $langs == true || $topics == true ]] && any=true
          printf 'atlas=%s\nlangs=%s\ntopics=%s\nany=%s\n' $atlas $langs $topics $any | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.changed.outputs.any == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.changed.outputs.any == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - if: steps.changed.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: pip install pyyaml numpy==1.26.4
      - name: Atlas templates compile and pass their tests
        if: steps.changed.outputs.atlas == 'true'
        run: python atlas/tools/verify.py templates
      - name: Language guides - every example runs and matches its recorded output
        if: steps.changed.outputs.langs == 'true'
        run: node langs/build.mjs --verify
      - name: Topic guides - every example runs and matches its recorded output
        if: steps.changed.outputs.topics == 'true'
        run: node langs/build.mjs --root topics --verify
      - name: Build site
        run: ./build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
