<title>PYQ Tracker</title>
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --text: #1c1c1e; --muted: #6b6b70; --line: #e3e3e0;
  --accent: #2f6fdb; --accent-soft: #e6eefc; --done: #2e8b57; --done-soft: #e5f4ec; --star: #d4a017;
  --code: #f0f0ee; --warn: #b5651d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9a9aa1; --line: #2e2e33;
    --accent: #6c9cff; --accent-soft: #1f2a40; --done: #4cc38a; --done-soft: #17301f; --star: #f0c040;
    --code: #2a2a2f; --warn: #e0a060;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9a9aa1; --line: #2e2e33;
  --accent: #6c9cff; --accent-soft: #1f2a40; --done: #4cc38a; --done-soft: #17301f; --star: #f0c040;
  --code: #2a2a2f; --warn: #e0a060;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.wrap { max-width: 980px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 6px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > div { height: 100%; background: var(--done); width: 0; transition: width .2s; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.headrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.headrow h1 { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--card); color: var(--text); border: none; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--accent); color: #fff; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tab { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 16px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
select, input[type=search] { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
input[type=search] { flex: 1; min-width: 160px; }
button.small { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
main { padding: 12px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; display: flex; gap: 10px; }
.card.done { background: var(--done-soft); }
.chk { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--done); cursor: pointer; flex-shrink: 0; }
.body { flex: 1; min-width: 0; }
.top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.title { font-weight: 600; }
.card.done .title { text-decoration: line-through; text-decoration-color: var(--muted); }
.star { margin-left: auto; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); padding: 0 2px; }
.star.on { color: var(--star); }
.meta { font-size: 13px; color: var(--muted); }
.stmt { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.links a.btn { text-decoration: none; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.links a.btn.approx { background: transparent; border: 1px dashed var(--accent); }
.kit { font-size: 13px; }
code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 13px; }
a { color: var(--accent); }
.hintbtn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; }
.hint { display: none; margin-top: 6px; font-size: 14px; border-left: 3px solid var(--accent); padding-left: 8px; }
.hint.show { display: block; }
.seen { font-size: 12px; color: var(--done); }
.empty { color: var(--muted); text-align: center; padding: 30px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 6px 12px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: .9; }
@media (max-width: 600px) { .tab { padding: 4px 9px; } }

.tabsnav { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.tabsnav a { font: 600 13.5px/1 var(--font-body, system-ui, sans-serif); color: var(--muted); text-decoration: none;
  padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabsnav a:hover { color: var(--ink, var(--text)); }
.tabsnav a[aria-current="page"] { color: var(--ink, var(--text)); border-bottom-color: var(--accent); }

.navbar { max-width: 980px; margin: 0 auto; padding: 8px 16px 0; }
[hidden]{display:none!important}
</style>

= k &lt;= n+1 (1-based) splitting the array into four parts; grossValue = sum(1,i-1) - sum(i,j-1) + sum(j,k-1) - sum(k,n), where an empty range sums to 0. Return the maximum grossValue (long). Constraints: 1 &lt;= n &lt;= 3000, -1e9 &lt;= arr[i] &lt;= 1e9. Example 1: arr=[-1,1,2,-2] -&gt; 6. Example 2: arr=[-4,-8,2,-10,3,-20] -&gt; 43. ⚠️ The saved text is messy: definition shows sum(i,j)-sum(j,k)+sum(k,n-1) and the worked rows/explanations are inconsistent; the 4-part formula above reproduces both sample outputs (6 and 43).", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "prefix sums + running max DP", "text": "With prefix P, value = 2*(P[a] - P[b] + P[c]) - P[n] for a&lt;=b&lt;=c; keep running best of P[a], then of P[a]-P[b], then of P[a]-P[b]+P[c]. O(n)."}}, {"id": "cw:amazon-minimum-sum-of-segment-increments-to-sort-servers", "topic": "Arrays", "n": 8, "title": "Minimum sum of segment increments to sort servers", "seenThisYear": false, "company": "Amazon", "source": "OA Set 1 + Set 2 (HackerRank) · Drive", "statement": "Given power[n], you may repeatedly pick a contiguous segment and add some x to every server in it. Choose the operations so that the array becomes non-decreasing and the sum of all x values is minimum; return that minimum sum (findMinimumSum). Input: n, then n integers. Constraints: 1&lt;=n&lt;=1e5, 1&lt;=power[i]&lt;=1e9. Examples: [3,4,1,6,2] -&gt; 7 (add 3 to indices 2..4, then 4 to index 4, giving [3,4,4,9,9]); [3,2,1] -&gt; 2; [3,5,2,3] -&gt; 3. ⚠️ Example text says 'subarray (2,4)' in 0-based indices. Same question appears in both Set 1 screenshots and Set 2 PDF.", "tests": [{"label": "CF 1392C", "url": "https://codeforces.com/problemset/problem/1392/C", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "sum of positive drops", "text": "Each drop a[i-1]&gt;a[i] must be paid for exactly once by a suffix increment, so the answer is sum over i of max(0, a[i-1]-a[i]). O(n); use 64-bit."}}, {"id": "cw:amazo irm the 2-of-3 rule.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "sort triples, prefix maxima", "text": "Sort each player's boosters x1&lt;x2&lt;x3. X beats Y iff x2&gt;y1 and x3&gt;y2 (top two of X against bottom two of Y). So X beats everyone iff x2 &gt; max over others of y1 and x3 &gt; max over others of y2; keep top-2 maxima of y1 and y2 to exclude self. O(n)."}}, {"id": "cw:amazon-maximum-reward-points-with-decaying-offers", "topic": "Arrays", "n": 13, "title": "Maximum reward points with decaying offers", "seenThisYear": false, "company": "Amazon", "source": "OA Set 2 (HackerRank) · Drive", "statement": "n items, points[i]. Each purchase gives the current points of that item; then every remaining item's points decrease by 1 (not below 0). Each item bought at most once. Return the maximum total (findMaxPoints). Constraints: 1&lt;=n&lt;=1e5, 0&lt;=points[i]&lt;=1e6. Examples: [5,2,2,3,1] -&gt; 7; [5,5,5] -&gt; 12; [1,3,5,2,4] -&gt; 9.", "tests": [{"label": "LC 3075", "url": "https://leetcode.com/problems/maximize-happiness-of-selected-children/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "sort descending greedy", "text": "Sort descending; the k-th purchase (0-based) gives max(0, p_k - k); sum while positive. O(n log n)."}}, {"id": "cw:amazon-minimum-total-lag-pairing-data-centers-to-servers", "topic": "Arrays", "n": 14, "title": "Minimum total lag pairing data centers to servers", "seenThisYear": false, "company": "Amazon", "source": "OA Set 2 (HackerRank) · Drive", "statement": "Arrays center[n] and destination[n] on a line. Match every center to a distinct destination; lag of a pair is |x-y|. Return the minimum total lag (getMinDistance). Constraints: 1&lt;=n&lt;=1e5, 1..1e9. Examples: center=[1,2,2], dest=[5,2,4] -&gt; 6; [3,1,6,8,9] vs [2,3,1,7,9] -&gt; 5; [4,6] vs [5,5] -&gt; 2.", "tests": [{"label": "LC 2037", "url": "https://leetcode.com/problems/minimum-number-of-moves-to-seat-everyone/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "sort both, pair in order", "text": "Sort both arrays and sum |c_i - d_i|; exchange argument. O(n log n), 64-bit sum."}}, {"id": "cw:apple-avatar-moves-with-two-bidirectional-portals", "topic": "Implementation", "n": 15, "title": "Avatar moves with two bidirectional portals", "seenThisYear": false, "company": "Apple", "source": "OA (CoderPad), Q12/12 · Drive", "statement": "Grid width x height, (0,0) top-left, coordinates are (column,row). Given the avatar position, portalA and portalB (each [x,y]) and a string moves of U/D/R/L. Walking onto a portal square teleports the avatar to the other portal (it stays there until the next move). A move that would leave the map is ignored (no move, no teleport). Return the final position compute_final_position(width,height,position,portalA,portalB,moves). Constraints: 0&lt;width&lt;20, 0&lt;height&lt;20, 0&lt;=|moves|&lt;=255. Example: width 5, height 4, position (0,0), portalA (1,1), portalB (2,3), moves 'DRR' -&gt; (3,3). Test groups: moves without portals, with portals, a portal used in both directions, complex moves with walls. ⚠️ Reads from stdin / writes to stdout per CoderPad note; the exact I/O format is not shown.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "grid simulation", "text": "Simulate each move: compute next cell, skip if out of bounds, else move and if it equals one portal jump to the other. O(|moves|)."}}, {"id": "cw:apple-single-lane-vehicles-head-on-collisions", "topic": "Arrays", "n": 16, "title": "Single-lane vehicles head-on collisions", "seenThisYear": false, "company": "Apple", "source": "OA (CoderPad) · Drive", "statement": "Array vehicles: |v| is weight, sign is direction (+ east, - west); all move at the same speed. When an eastbound meets a westbound, the lighter is removed; equal weights both removed; same-direction never meet. Return the surviving vehicles in order. Constraints: 2&lt;=n&lt;=10^4, -1000&lt;=v&lt;=1000  "seenThisYear": false, "company": "Axtria", "source": "Interview Set 1 (19 Aug), Round 1 · Drive", "statement": "Given a tree and two nodes, find their lowest common ancestor. ⚠️ Interview question recalled in one line; tree type (binary/BST) not specified.", "tests": [{"label": "LC 236", "url": "https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "recursive DFS LCA", "text": "Recurse: if node is null or equals p/q return it; if both left and right recursion return non-null, current node is the LCA, else propagate the non-null one. O(n)."}}, {"id": "cw:axtria-insert-a-node-in-a-singly-linked-list", "topic": "Implementation", "n": 20, "title": "Insert a node in a singly linked list", "seenThisYear": false, "company": "Axtria", "source": "Interview Set 1 (19 Aug), Round 1 · Drive", "statement": "Insert a node into a singly linked list (position not specified: head, tail or given index). ⚠️ One-line recall; insertion position not specified.", "tests": [{"label": "LC 707 (Design Linked List)", "url": "https://leetcode.com/problems/design-linked-list/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "linked list pointer manipulation", "text": "Walk to the node before the target position, set new-&gt;next = prev-&gt;next, prev-&gt;next = new; handle head insertion separately. O(position)."}}, {"id": "cw:axtria-generate-all-permutations-of-an-array", "topic": "Arrays", "n": 21, "title": "Generate all permutations of an array", "seenThisYear": false, "company": "Axtria", "source": "Interview Set 1 (19 Aug), Round 1 · Drive", "statement": "Given an array of integers, find all its permutations (the note says \"find their total permutations\": either list them or count them). ⚠️ Ambiguous whether to print or count permutations, and whether duplicates exist.", "tests": [{"label": "LC 47", "url": "https://leetcode.com/problems/permutations-ii/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "backtracking", "text": "Backtrack by swapping each element into the current position (skip duplicates with a set per level if values repeat). O(n * n!). Count alone = n! / prod(freq!)."}}, {"id": "cw:browserstack-wordplay-longest-concatenation-with-unique-char", "topic": "Strings", "n": 22, "title": "Wordplay: longest concatenation with unique characters", "seenThisYear": false, "company": "BrowserStack", "source": "Set 1, SDET OA · Drive", "statement": "Given N words (lowercase), return the length of the longest string formed by concatenating some of the words such that no character repeats. Constraints: 1 &lt;= N &lt;= 16. Sample: [ab, cd, ef, ab, de] -&gt; 6 (ab+cd+ef).", "tests": [{"label": "LC 1239", "url": "https://leetcode.com/problems/maximum-length-of-a-concatenated-string-with-unique-characters/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "bitmask backtracking", "text": "Drop words with internal duplicates, convert to bitmasks, try all subsets via backtracking keeping disjoint masks. O(2^N * 26)."}}, {"id": "cw:browserstack-new-game-finish-levels-during-work-breaks", "topic": "Maths", "n": 23, "title": "New game: finish levels during work breaks", "seenThisYear": false, "company": "BrowserStack", "source": "Set 1, SDET OA · Drive", "statement": "Each day has k minutes and n breaks [l_i, r_i] (same every day, sorted, r_i &lt; l_{i+1}). The game has m levels, each taking t consecutive minutes, and can only be played inside breaks. Find the minimum number of minutes from the start of the first level to the end of the last level, or -1 if impossible. Input: T test cases; each: n m t k, then n lines l_i r_i. Constraints: T &lt;= 2*10^5; n &lt;= 10^5; 1 &lt;= m,k,t &lt;= 10^9; 0 &lt;= l_i &lt; r_i &lt;= k; sum of n &lt;= 10^6. Sample: (n=1,m=5,t=3,k=9, break [3,7]) -&gt; 38; (n=1,m=5,t=5,k=9, break [3,7]) -&gt; -1. ⚠️ ⚠️ Function description is partly truncated, and the sample answer 38 does not match a simple count (start at minute 3 of day 1, end at minute 6 of day 5 = 39); levels may not be splittable across breaks. The explanation calls the player Saiki and Bob interchangeably.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "greedy over cyclic breaks", "text": "Each break fits c_i = floor((r_i-l_i)/t) levels; if all c_i = 0 answer -1. Try each starting break j: full days = levels / sum(c), then walk the remaining breaks with prefix sums + binary search (over a doubled array) to find the end break; total time = end time - l_j. Take the minimum. O(n log n)."}}, {"id": "cw:cisco-budgeted-influencer-seed-selection-greedy", "topic": "Graphs", "n": 24, "title": "Budgeted influencer seed selection (greedy)", "seenThisYear": false, "company": "Cisco", "source": "Set 2 / coding round (3 & 7 Sep 2025) · Drive", "statement": "An undirected network of n users (1..n) with friendship edges. Some users are 'seedable', each with a cost; every user has a market value. Choose seeds without exceeding budget; a seed reaches all users within distance d (d=1 means direct friends; the seed itself counts). Maximise total value of UNIQUE users reached. Expected heuristic (from the examples): repeatedly pick the affordable seed with the highest marginal efficiency = (value of newly reached users)/cost, ties broken by input order of seeds; stop when no affordable seed adds positive value. Input (stdin): n; m; m lines 'u v'; s; s lines 'user_id cost'; a line of n values (value of user i); budget; depth. Output: chosen seeds in selection order (space-separated), then total value, then total cost, each on its own line. Sample: 5 users, edges (1,2),(1,3),(4,5); seeds 1(cost 50),4(cost 60); values 10 20 30 5 5; budget 100; d=1 -&gt; output '1' / 60 / 50 (seed 1 efficiency 60/50=1.2 beats 10/60). Example 2: edges (1,2),(1,3),(4,3),(4,5), costs {1:60,4:70}, values {1:5,2:10,3:20,4:5,5:30}, budget 150, d=1 -&gt; seeds [4,1], value 70, cost 130 (4 first: 55/70; then 1 adds only {1,2}: 15/60). ⚠️ Problem says brute force is infeasible and asks for a heuristic; the greedy-by-efficiency rule is inferred from the worked examples. Some screenshots show a Python stub (Set 2), others C++.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "BFS reach + greedy marginal gain", "text": "Precompute each seed's reach set with a depth-limited BFS. Then loop: for each unused affordable seed compute marginal value of not-yet-reached users / cost, take the best (tie -&gt; earlier in seed order), mark its reach. O(S * (reach + S)) roughly."}}, {"id": "cw:cisco-find-all-dictionary-words-in-grid-8-directional", "topic": "Strings", "n": 25, "title": "Find all dictionary words in grid (8-directional)", "seenThisYear": false, "company": "Cisco", "source": "OA (7 Sep 2025) Q9 · Drive", "statement": "Given an r x c grid of lowercase letters and a dictionary of words, find every dictionary word that can be formed by a path of adjacent cells, where adjacency is 8-directional (including diagonals) and a cell is used at most once per word. Input: 'rows cols', then rows lines of space-separated chars, then num_words, then one word per line. Output: count of distinct found words, then the words sorted alphabetically one per line (print only 0 if none). Constraints: 1&lt;=m,n&lt;=20 (m*n&lt;=400), up to 100,000 words, word length 1..20, 2 s limit. Sample: grid oaan/etae/ihkr/iflv, words oath pea eat rain oat cat hike kite duplicate -&gt; 3, eat, oath, oat. ⚠️ Example 2 looks inconsistent: dictionary [abceseeefs, see, seed, ased, sad] but output lists 'abs' (not in dictionary) and omits 'ased'. Sample explanation says 'hike' cannot be formed although with 8-dir moves path checks differ; trust the sample output. The sample input lists 'duplicate' as a word after the 9 count.", "tests": [{"label": "LC 212", "url": "https://leetcode.com/problems/word-search-ii/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "trie + DFS backtracking", "text": "Insert all words into a trie, DFS from every cell in 8 directions following trie children, mark visited, record words at terminal nodes (dedupe, prune finished branches). Then sort. Roughly O(cells * 8^L) bounded by trie."}}, {"id": "cw:cisco-minimum-time-to-visit-task-nodes-in-tree", "topic": "Graphs", "n": 26, "title": "Minimum time to visit task nodes in tree", "seenThisYear": false, "company": "Cisco", "source": "Set 1 - FY26 Cisco Day OA (24 Jun 2025) Q3 · Drive", "statement": "A tree of tree_nodes servers (1..n), edges tree_from[i]-tree_to[i], each edge takes 1 unit of time. Start at start_node, visit all nodes in task_nodes (any order), and finish at end_node. Return the minimum time. start_node != end_node and start_node is not in task_nodes; task nodes are distinct. Constraints: 2 &lt;= tree_nodes &lt;= ~2*10^5, 1 &lt;= num_tasks &lt;= tree_nodes. Example: n=4, edges 1-3, 2-3, 2-4, start=1, end=2, tasks=[4] -&gt; 4 (path 1-&gt;3-&gt;2-&gt;4-&gt;2). ⚠️ Upper constraint partly unreadable (looks like 2*10^5).", "tests": [{"label": "LC 1443", "url": "https://leetcode.com/problems/minimum-time-to-collect-all-apples-in-a-tree/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "Steiner subtree edge count", "text": "Root the tree at start_node; mark every edge whose subtree contains a task node or end_node (needed edges E). Every needed edge is walked twice except those on the start-&gt;end path, which are walked once: answer = 2*E - dist(start,end). O(n)."}}, {"id": "cw:cisco-collect-coins-within-distance-2-in-a-tree", "topic": "Graphs", "n": 27, "title": "Collect coins within distance 2 in a tree", "seenThisYear": false, "company": "Cisco", "source": "Set 1 - FY26 Cisco Day OA (24 Jun 2025) Q22 · Drive", "statement": "A tree with n vertices (0..n-1) and coins[i] in {0,1}. From any vertex you can collect all coins within distance 2. Choose any start vertex, walk along edges (edges may repeat) collecting all coins and return to the start. Return the minimum number of edges traversed. Example: n=11, from=[0,0,0,1,1,3,4,6,7,8], to=[1,2,6,3,4,10,5,7,8,9], coins=[0,0,1,1,0,0,0,0,0,1,1] -&gt; 6 (path 1-&gt;0-&gt;6-&gt;7-&gt;6-&gt;0-&gt;1). Constraints: 2 &lt;= n &lt;= 10^5 (approx), coins[i] is 0 or 1. ⚠️ Function is getMinPath; upper constraint on n not fully readable.", "tests": [{"label": "LC 2603", "url": "https://leetcode.com/problems/collect-coins-in-a-tree/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "leaf trimming topological peel", "text": "Repeatedly remove leaves with no coin; then remove two more layers of leaves (coins within distance 2 are collectable). Remaining tree with k edges needs 2*k edges walked (0 if empty). O(n)."}}, {"id": "cw:cohesity-shortest-path-after-adding-one-edge", "topic": "Graphs", "n": 28, "title": "Shortest path after adding one edge", "seenThisYear": false, "company": "Cohesity", "source": "OA - IIIT Bangalore · Drive", "statement": "Given an undirected weighted graph as an n x n adjacency matrix (0 = no edge), nodes numbered from 1, a start node, a finish node and a weight w. You may add at most one edge of weight w between any two nodes that are not directly connected. Return the shortest possible distance from start to finish. Example: start=1, finish=4, weight=2, graph=[[0,2,0,4,0],[2,0,1,0,0],[0,1,0,3,0],[4,0,3,0,1],[0,0,0,1,0]] -&gt; 3 (original distance 1-&gt;4 is 4; adding edge 1-5 of weight 2 gives 2+1=3). ⚠️ Constraints and I/O section cut off in the screenshot; only the statement and example are visible.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "Dijkstra from both ends", "text": "Run Dijkstra from start (ds) and from finish (df). Answer = min(ds[finish], min over non-adjacent pairs u!=v of ds[u]+w+df[v]). O(n^2) with the dense matrix."}}, {"id": "cw:cohesity-levenshtein-edit-distance-of-two-strings", "topic": "DP", "n": 29, "title": "Levenshtein (edit) distance of two strings", "seenThisYear": false, "company": "Cohesity", "source": "OA - IIIT Bangalore · Drive", "statement": "Given two lowercase strings string1 and string2 (0 &lt;= length &lt;= 1000 each), return the Levenshtein distance: minimum number of single-character insertions, deletions and substitutions to turn string1 into string2. Example: 'fight', 'friend' -&gt; 4 (insert r, g-&gt;e, h-&gt;n, t-&gt;d). Time limit 0.5 s (C++).", "tests": [{"label": "LC 72", "url": "https://leetcode.com/problems/edit-distance/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "edit distance DP", "text": "dp[i][j] = edit distance of prefixes; dp[i][j] = dp[i-1][j-1] if chars equal else 1+min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]). O(n*m) time, O(m) memory with rolling rows."}}, {"id": "cw:d-e-shaw-nearest-smaller-element-index-on-either-side", "topic": "Arrays", "n": 30, "title": "Nearest smaller element index on either side", "seenThisYear": false, "company": "D. E. Shaw", "source": "drive · Drive", "statement": "Given an array and queries (indices). For each query index i, find the nearest index j (on either the left or the right) with arr[j] &lt; arr[i]. If none exists return -1; if two are equally near, return the smaller index. Return the answers for all queries as vector&lt;int&gt;. No constraints or samples recorded. ⚠️ Recalled from memory; no samples/constraints.", "tests": [{"label": "LC 503", "url": "https://leetcode.com/problems/next-greater-element-ii/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "monotonic stack both sides", "text": "Precompute previous-smaller and next-smaller index for every position with two monotonic-stack passes; for each query compare distances, tie -&gt; left (smaller index). O(n + q)."}}, {"id": "cw:d-e-shaw-max-azm-subsequences-after-at-most-one-insertion", "topic": "Strings", "n": 31, "title": "Max 'AZM' subsequences after at most one insertion", "seenThisYear": false, "company": "D. E. Shaw", "source": "drive · Drive", "statement": "Given a string, count the subsequences equal to \"AZM\". You may perform at most one operation: insert any one character anywhere in the string. Find the maximum possible count (presumably). No constraints or samples recorded. ⚠️ ⚠️ Statement is a brief recollection; 'maximum' is implied, not stated.", "tests": [{"label": "LC 2207", "url": "https://leetcode.com/problems/maximize-number-of-subsequences-in-a-string/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "prefix/suffix counts greedy", "text": "Count base AZM subsequences with DP. Best insertion: 'A' at the start adds #(ZM subsequences); 'M' at the end adds #(AZ subsequences); 'Z' at position p adds countA(prefix p) * countM(suffix p), maximise over p. Answer = base + max gain. O(n)."}}, {"id": "cw:d-e-shaw-min-changes-so-every-subarray-has-a-unique-element", "topic": "Arrays", "n": 32, "title": "Min changes so every subarray has a unique element", "seenThisYear": false, "company": "D. E. Shaw", "source": "drive · Drive", "statement": "Given an array, in one operation you can change any element to any value. Find the minimum number of operations so that every subarray contains at least one element whose frequency in that subarray is exactly 1. No constraints or samples recorded. ⚠️ Matches CF 1969E Unique Array.", "tests": [{"label": "CF 1969E", "url": "https://codeforces.com/problemset/problem/1969/E", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "greedy + segment tree", "text": "Scan left to right keeping, for each left end l, the number of values unique in [l, r] (range add on prev/next occurrence via a lazy segment tree). When some l has zero uniques, change a[r] to a fresh value (count++) and restart from r+1. O(n log n)."}}, {"id": "cw:d-e-shaw-minimum-prefix-switches-to-zero-all-transactions", "topic": "Arrays", "n": 33, "title": "Minimum prefix switches to zero all transactions", "seenThisYear": false, "company": "D. E. Shaw", "source": "HackerRank OA, 2025-07-01 (3 questions) · Drive", "statement": "Given an integer array transactions[n]. In one 'switch' you choose a prefix (a contiguous group starting at index 0) of any length and either add 1 to or subtract 1 from every element in it. Return the minimum number of switches needed to make every element 0 (always possible). Function: long getMinimumSwitches(vector&lt;int&gt; transactions). Constraints: 1 &lt;= n &lt;= 1e5, -1e9 &lt;= transactions[i] &lt;= 1e9. Example: [3,2,1] -&gt; 3 (prefix len 2 -1 -&gt; [2,1,1], prefix len 1 -1 -&gt; [1,1,1], prefix len 3 -1 -&gt; [0,0,0]). Sample: [3,2,0,0,-1] -&gt; 5.", "tests": [{"label": "LC 1526", "url": "https://leetcode.com/problems/minimum-number-of-increments-on-subarrays-to-form-a-target-array/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "difference array / prefix ops", "text": "Element i is changed by every prefix op of length &gt; i, so the number of ops ending exactly at i must be |t[i] - t[i+1]| (with t[n] = 0). Answer = sum of |t[i]-t[i+1]| for i &lt; n-1 plus |t[n-1]|. O(n), use 64-bit."}}, {"id": "cw:d-e-shaw-valid-passwords-built-by-wrapping-and-concatenation", "topic": "Strings", "n": 34, "title": "Valid passwords built by wrapping and concatenation", "seenThisYear": false, "company": "D. E. Shaw", "source": "HackerRank OA, 2025-07-01 (3 questions) · Drive", "statement": "Valid passwords are defined by: (1) the empty string is valid; (2) if A is valid, xAx is valid for any character x; (3) if A and B are valid, AB and BA are valid. Given n lowercase strings passwords[], return an int array with 1 if passwords[i] is valid else 0. Function: vector&lt;int&gt; findValidPasswords(vector&lt;string&gt; passwords). Constraints: 1 &lt;= n &lt;= 10, 1 &lt;= |passwords[i]| &lt;= 1e5. Examples: ['abba','abca'] -&gt; [1,0]; ['daabbd','abc'] -&gt; [1,0]; ['acac'] -&gt; [0].", "tests": [{"label": "LC 1047", "url": "https://leetcode.com/problems/remove-all-adjacent-duplicates-in-string/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "stack cancel adjacent pairs", "text": "The grammar generates exactly the strings that reduce to empty by repeatedly deleting two adjacent equal characters. Push characters on a stack, popping when the top equals the current char; valid iff the stack ends empty. O(total length)."}}, {"id": "cw:d-e-shaw-count-single-colour-cycles-formed-by-adding-one-edg", "topic": "Graphs", "n": 35, "title": "Count single-colour cycles formed by adding one edge to a tree", "seenThisYear": false, "company": "D. E. Shaw", "source": "HackerRank OA, 2025-07-01 (3 questions) · Drive", "statement": "A tree of tree_nodes nodes (1..n) with edges tree_from[i]-tree_to[i]; colors[i] is 0 (white) or 1 (black) for node i+1. Count the distinct ways to add one edge between two stations so that the cycle formed has at least 3 nodes and all its nodes have the same colour. Function: long countRouteCycles(int tree_nodes, vector&lt;int&gt; tree_from, vector&lt;int&gt; tree_to, vector&lt;int&gt; colors). Constraints: 1 &lt;= tree_nodes &lt;= 1e5, 1 &lt;= m &lt; 1e5, colors in {0,1}. Example: n=6, edges 1-2,2-3,2-4,1-5,5-6, colors [0,1,1,1,0,0] -&gt; 2 (edges 3-4 and 1-6). Sample: n=6, edges 1-2,2-3,2-4,2-5,4-6, colors [0,1,1,1,1,0] -&gt; 3. Sample: n=5, edges 1-2,2-3,2-4,3-5, colors [0,0,0,1,0] -&gt; 3.", "tests": [{"label": "LC 2316", "url": "https://leetcode.com/problems/count-unreachable-pairs-of-nodes-in-an-undirected-graph/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "same-colour components counting", "text": "The cycle is the tree path plus the new edge, so the whole path must lie in one monochromatic connected component and have length &gt;= 2 edges. For a component of size s (a tree) that is C(s,2) - (s-1) = (s-1)(s-2)/2 pairs. Find components with DFS/DSU over same-colour edges and sum. O(n)."}}, {"id": "cw:d- tiguous) is dominant if at least one number appears K or more times in it. Count the dominant subarrays (function countDominantSubarrays(N, K, arr)).\nInput: N, then K, then N integers. Output: the count.\nConstraints: 1 &lt;= N &lt;= 1e5, 1 &lt;= K &lt;= N, 1 &lt;= A[i] &lt;= 1e9. TL 2 s.\nSample: N=5, K=2, arr=[1,2,1,2,1] -&gt; 6 ([1,2,1], [2,1,2], [1,2,1], [1,2,1,2], [2,1,2,1], [1,2,1,2,1]). ⚠️ Question 6 of 8. Sample output reads 6; explanation lists the 6 subarrays (last one written as [2,1,2,1,2], probably meant [1,2,1,2,1]).", "tests": [{"label": "LC 2962", "url": "https://leetcode.com/problems/count-subarrays-where-max-element-appears-at-least-k-times/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "two pointers / sliding window", "text": "For each left end the minimal right end where some count reaches K is non-decreasing; slide right pointer keeping counts in a hash map and a flag/counter of values with count &gt;= K; add N - r for each l. O(N) with coordinate compression or hashing."}}, {"id": "cw:devrev-crayon-removal-scoring-game-remove-boxes", "topic": "DP", "n": 48, "title": "Crayon Removal Scoring Game (remove boxes)", "seenThisYear": false, "company": "DevRev", "source": "OA Set 1 · Drive", "statement": "A container has N crayons in a row, each colour a lowercase letter. In each move you remove a continuous group of x &gt;= 1 adjacent crayons of the same colour and earn x*x points; remaining crayons close the gap. Repeat until empty. Return the maximum total points (solve(int N, vector&lt;char&gt; colors)).\nInput: N, then N space-separated characters. Constraints: 1 &lt;= N &lt;= 60; lowercase letters only. TL 5 s.\nSample: 7 / a a b b a a c -&gt; 21 (remove bb: 4 -&gt; [a,a,a,a,c]; remove c: +1; remove aaaa: +16 =&gt; 21). ⚠️ Question 7 of 8.", "tests": [{"label": "LC 546", "url": "https://leetcode.com/problems/remove-boxes/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "interval DP with extra count", "text": "Classic Remove Boxes: dp[l][r][k] = best for segment l..r with k extra crayons equal to colors[l] attached to the left; either remove the group now ((k+1)^2 + dp[l+1][r][0]) or merge with a later same colour m: dp[l+1][m-1][0] + dp[m][r][k+1]. O(N^4) worst, fine for N=60."}}, {"id": "cw:devrev-lfu-cache-with-smallest-key-tie-break", "topic": "Implementation", "n": 49, "title": "LFU cache with smallest-key tie break", "seenThisYear": false, "company": "DevRev", "source": "OA Set 1 · Drive", "statement": "Implement a Least Frequently Used (LFU) cache of capacity N. Q operations, each 3 integers:\n- '1 key -1' (type 1): get value of key; print -1 if not present.\n- '2 key value' (type 2): update value if key present, else insert. When the cache is at capacity, remove the least frequently used key before inserting a new item; on a tie (same frequency) remove the SMALLEST key.\nPrint the answers of type-1 queries space-separated on one line (function solve(N, Q, operations) returns the array).\nInput: N, then Q, then Q lines of 3 integers. Constraints: 1 &lt;= N &lt;= 5e4, 1 &lt;= Q &lt;= 2e5, 1 &lt;= K &lt;= 2e5, 1 &lt;= value &lt;= 1e9. TL 1 s.\nSample: N=2, Q=5, ops (1,2,-1),(2,1,3),(2,2,4),(2,4,5),(1,2,-1) -&gt; output '-1 4' (key 1 evicted on the tie with key 2). ⚠️ Question 8 of 8. Differs from LC 460: ties broken by smallest key, not least recently used. ⚠️ Whether a get/update counts as a use (frequency +1) is not stated explicitly; sample's walk-through treats key 2 freq equal to key 1 after one put each (the initial failed get on key 2 did not count). Question 1 of the set is not in the PDF.", "tests": [{"label": "LC 460", "url": "https://leetcode.com/problems/lfu-cache/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "hash map + ordered set by (freq,key)", "text": "Keep map key-&gt;(value,freq) and std::set of (freq,key); get/put update freq by erasing and reinserting; eviction takes set.begin() which gives min freq then min key. O(log N) per op."}}, {"id": "cw:epam-count-subarrays-with-zero-sum", "topic": "Arrays", "n": 50, "title": "Count subarrays with zero sum", "seenThisYear": false, "company": "EPAM", "source": "EPAM Freshers Test S17 (deselect), OA Set 1, 2025-08-17 — Coding Q1 · Drive", "statement": "Given an integer array arr of length n, count the contiguous subarrays whose sum is exactly 0. Function: int countZeroSumSubarrays(vector&lt;int&gt; arr). Input: first line n, second line n space-separated integers. Output: a single integer, the number of zero-sum subarrays. Constraints: 1 &lt;= n &lt;= 10^5, -10^5 &lt;= arr[i] &lt;= 10^5. Execution time limit 4 s. Sample 1: n=6, arr=[1,-3,2,3,6,-1] -&gt; 1 (only [1,-3,2]). Sample 2: n=8, arr=[4,8,9,-4,1,-1,-8,-9] -&gt; 2 ([1,-1] at indices 4..5 and the whole array 0..7). ⚠️ Constraint '1 &lt;= n &lt;= 10^5' is faint/red in the screenshot but readable.", "tests": [{"label": "LC 560", "url": "https://leetcode.com/problems/subarray-sum-equals-k/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "prefix sum + hashmap", "text": "Keep a hashmap of prefix-sum frequencies starting with {0:1}; for each prefix sum s add freq[s] to the answer, then increment freq[s]. Use 64-bit for the count. O(n) time, O(n) space."}}, {"id": "cw:epam-decode-borze-style-dot-dash-code-to-digits", "topic": "Strings", "n": 51, "title": "Decode Borze-style dot/dash code to digits", "seenThisYear": false, "company": "EPAM", "source": "EPAM Freshers Test S17 (deselect), OA Set 1, 2025-08-17 — Coding Q2 · Drive", "statement": "Given a string 'encrypted' made of '.' and '-' characters, decode it into a string of ternary digits using the code: '.' -&gt; '0', '-.' -&gt; '1', '--' -&gt; '2'. Return the decoded string. A visible test case: input '.-.--.-.--.-.--...' (a long repetition of '.', '-.', '--') with expected output '012012012012012012012012012012012012'. ⚠️ ⚠️ The problem statement itself was not photographed; it is reconstructed from the candidate's code (WA0038) and a failing test case (expected output 012012...). Note the candidate's code maps '-' followed by '-' to '2' and anything else to '1', which looks right, yet the tests show failed — the exact mapping in the original statement could not be confirmed.", "tests": [{"label": "CF 32B", "url": "https://codeforces.com/problemset/problem/32/B", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "linear scan parsing", "text": "Scan left to right: if s[i]=='.' append '0' and i+=1; else look at s[i+1]: '.' -&gt; append '1', '-' -&gt; append '2', and i+=2. O(n)."}}, {"id": "cw:epam-maximum-shipments-keeping-inventory-strictly-positive", "topic": "Arrays", "n": 52, "title": "Maximum shipments keeping inventory strictly positive", "seenThisYear": false, "company": "EPAM", "source": "OA Set 1, 2025-08-17 — HackerRank test (browser tab reads 'NEXT STEPS: Amazon Softw...') — Code Question 1 · Drive", "statement": "An Amazon warehouse processes n shipments; inventoryAdjustments[i] is the change to inventory (positive = restock, negative = items taken out). Starting from inventory 0, you may process shipments in any order, each at most once; inventory must stay strictly positive after every processed shipment — if it reaches 0 or goes negative, operations halt. Return the maximum number of shipments that can be processed. Function: int optimizeInventory(vector&lt;int&gt; inventoryAdjustments). Constraints: 1 &lt;= n &lt;= 10^5, -10^9 &lt;= inventoryAdjustments[i] &lt;= 10^9. Example: [4,-4,-3,1,2] -&gt; 4 (e.g. order [1,4,-3,2,-4]: 1,5,2,4 then 0). Sample 0: [3,-5,8,-9,-7] -&gt; 3 (order [3,8,-7,-5,-9]: 3,11,4 then -1). Sample 1: [-1,-3,-2,0] -&gt; 0. ⚠️ This is a HackerRank test whose browser tab shows an Amazon 'NEXT STEPS' email — likely an Amazon SDE OA saved in the EPAM folder. Sample 0's walkthrough table is partly cut off. LC 2587 is the same task (count of positive prefix sums after best rearrangement).", "tests": [{"label": "LC 2587", "url": "https://leetcode.com/problems/rearrange-array-to-maximize-prefix-score/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "greedy sort + prefix sum", "text": "Sort descending and take the longest prefix whose running sum stays &gt; 0 (use 64-bit sums); that count is the answer. O(n log n)."}}, {"id": "cw:epam-minimum-cost-to-turn-all-products-to-variant-a", "topic": "Arrays", "n": 53, "title": "Minimum cost to turn all products to variant A", "seenThisYear": false, "company": "EPAM", "source": "OA Set 1, 2025-08-17 — HackerRank test (browser tab reads 'NEXT STEPS: Amazon Softw...') — Code Question 2 · Drive", "statement": "product[] is a 0/1 array of length n (1 = type B, 0 = type A). An operation: choose l, r with 0 &lt;= l &lt;= r &lt; n and r-l+1 = k; it costs product[l]+...+product[r] (the current values); then choose an index p in [l, r] and set product[p] = 0. Repeat as many times as needed. Return the minimum total cost to make every product 0 (type A). Function: long getMinimumCost(int product[n], int k). Input: n, then n lines of product[i], then k. Constraints: 1 &lt;= k &lt;= n &lt;= 10^5, product[i] in {0,1}. Example: product=[1,1,1,0,1], k=4 -&gt; 7 ([1,4] set p=1 cost 3; [0,3] set p=2 cost 2; [1,4] set p=4 cost 1; [0,3] set p=0 cost 1). Sample 0: [1,0,1,0,1], k=3 -&gt; 3. Sample 1: [1,1,0,1], k=3 -&gt; 4. ⚠️ Same HackerRank/Amazon test as Code Question 1 (likely an Amazon OA saved in the EPAM folder). The last line of the example walkthrough is partly cut off; the total 3+2+1+1=7 is visible. ⚠️ The approach is not proven; check it with a brute force.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "greedy + sliding window", "text": "Think in reverse: put the 1s back one at a time; re-inserting a 1 costs the fewest 1s present in any length-k window that contains it, counting itself. Greedily re-insert the cheapest one each time (sparse areas and ends first), keeping window counts in a segment tree, O(n log n). Matches all three samples. Not proven optimal."}}, {"id": "cw:flipkart-process-stage-transitions-a-e", "topic": "Implementation", "n": 54, "title": "Process stage transitions A-E", "seenThisYear": false, "company": "Flipkart", "source": "OA set 1 (HirePro) - Generic Coding 3, Q2 · Drive", "statement": "P processes (numbered 1..P) all start in stage A. Allowed moves (directed): A-&gt;B, B-&gt;C, C-&gt;B, C-&gt;D, C-&gt;E, D-&gt;B, written as AB, BC, CB, CD, CE, DB. Q steps of the form 'SD X' mean process X moves from stage S to stage D; a step is executed only if process X is currently in stage S (and the move is allowed), otherwise it is ignored. After all steps, print 5 lines, one per stage A..E: the stage letter followed by the processes in it in ascending order. Input: 'P Q', then Q lines 'SD X'. Constraints: 1 &lt;= P &lt;= 1000, 1 &lt;= Q &lt;= 1000. Sample 1: 10 11 / AB 2, AB 5, AB 8, AB 4, AB 9, BC 5, BC 8, BC 9, CB 5, CD 8, CE 9 -&gt; 'A 1 3 6 7 10', 'B 2 4 5', 'C', 'D 8', 'E 9'. Sample 2: 3 3 / AB 1, CD 1, AB 3 -&gt; 'A 2', 'B 1 3', 'C', 'D', 'E'. ⚠️ Function stub: void processQuery(int n, int p, string query[]).", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "state simulation", "text": "Keep stage[x] for each process; for each step check stage[X]==S and the edge is allowed, then update. Finally bucket processes by stage. O(P+Q)."}}, {"id": "cw:flipkart-2048-game-final-score-after-key-presses", "topic": "Implementation", "n": 55, "title": "2048 game: final score after key presses", "seenThisYear": false, "company": "Flipkart", "source": "OA set 1 (HirePro) - Generic Coding 2 · Drive", "statement": "A 4x4 2048 board. Each key press (U/u up, D/d down, L/l left, R/r right) moves all tiles in that direction; adjacent equal tiles in the movement direction merge into their sum (e.g. '4 4' on R becomes '0 8', '2 4' stays, '4 0' on R becomes '0 4'); moves happen row-wise for L/R and column-wise for U/D. The score of a press is the sum of all cells created by merges in that press; output the total score after N presses. Input: 4 lines of 4 values (each 0 or 2^k, 1&lt;=k&lt;=11), then N, then N lines each with one key. Sample 1: 16 256 256 512 / 4 0 0 32 / 64 0 0 8 / 2 2 1024 2 / 2 / R / d -&gt; 516. Sample 2: 2 4 8 16 / 2 4 2 2 / 2 2 4 4 / 8 64 32 0 / 3 / L / U / U -&gt; 52. ⚠️ Function stub: PrintFinalScore(int grid[][4], int num_ops, char moves[]). Each tile merges at most once per press (standard 2048).", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "grid simulation (2048 merge)", "text": "For each press, process every row/column toward the move direction: compress non-zeros, merge equal neighbours once from the leading edge, add merged value to score, pad zeros. O(16·N)."}}, {"id": "cw:flipkart-extract-numbers-from-cryptic-strings-and-sort", "topic": "Strings", "n": 56, "title": "Extract numbers from cryptic strings and sort", "seenThisYear": false, "company": "Flipkart", "source": "OA set 1 (HirePro) - Generic Coding 1, Q3 · Drive", "statement": "Given N strings made of English letters and digits, extract every maximal run of digits as a number (strip leading zeros; an all-zero run is 0; repeated numbers are kept each time) and print all numbers found across all strings in non-decreasing order, one per line. Constraints: 1 &lt;= N &lt;= 100, each string at most 100 characters. Sample 1: 2 / 6rgg09n4l7 / b28xc7k9 -&gt; 4 6 7 7 9 9 28 (one per line). Sample 2 input: 3 / 0x2zf40w / ex48 / 50. ⚠️ ⚠️ Sample Output 2 is cut off in the photos (by the rules it would be 0 2 40 48 50). Function stub: void SolvePuzzle(int n, string str[]).", "tests": [{"label": "LC 1805", "url": "https://leetcode.com/problems/number-of-different-integers-in-a-string/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "parse digit runs + sort", "text": "Scan each string, accumulate digit runs, convert after stripping leading zeros (keep as string/long), collect and sort numerically. O(total length · log)."}}, {"id": "cw:google-find-a-root-that-makes-the-tree-binary", "topic": "Graphs", "n": 57, "title": "Find a root that makes the tree binary", "seenThisYear": false, "company": "Google", "source": "1st interview round · Drive", "statement": "You are given an undirected acyclic (tree) graph as an adjacency list where every vertex has at most 3 neighbours. Return a vertex which, when chosen as root, makes the tree a valid binary tree (each node has at most 2 children). ⚠️ Interview question; no samples or constraints given.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "degree check", "text": "A non-root node uses one neighbour as its parent, so it has &lt;=2 children automatically; the root needs degree &lt;= 2. Return any vertex with degree &lt;= 2 (a leaf always exists). O(n)."}}, {"id": "cw:google-binary-tree-root-with-alternating-two-colour-levels", "topic": "Graphs", "n": 58, "title": "Binary tree root with alternating two-colour levels", "seenThisYear": false, "company": "Google", "source": "1st interview round · Drive", "statement": "Follow-up: same tree (max 3 neighbours per vertex), each vertex coloured black or white (colour array given). Return a root such that the result is a valid binary tree whose levels alternate colours (B-W-B-W... or W-B-W-B...), or -1 if impossible. ⚠️ Interview question; no samples or constraints given.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "edge colour check + degree", "text": "Levels alternate iff every edge joins different colours, which does not depend on the root. If any edge has equal colours return -1; otherwise return any vertex of degree &lt;= 2. O(n)."}}, {"id": "cw:google-binary-tree-root-with-cyclic-three-colour-levels", "topic": "Graphs", "n": 59, "title": "Binary tree root with cyclic three-colour levels", "seenThisYear": false, "company": "Google", "source": "1st interview round · Drive", "statement": "Follow-up: vertices are coloured Red, Black, White. Return a root such that the tree is a valid binary tree and level colours follow the cyclic order R-B-W-R-B-W (starting anywhere in the cycle: RBW, BWR or WRB; reversed order like B-R-W is not valid). Return -1 if impossible. ⚠️ Interview question; no samples or constraints given.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "orient edges, find unique source", "text": "For each edge (u,v) the child's colour must be next(parent's colour) in R-&gt;B-&gt;W-&gt;R, so each edge has a forced direction (or is invalid if colours are equal). Orient all edges; a valid root is the unique vertex with in-degree 0 while all others have in-degree 1, and it must have degree &lt;= 2. O(n)."}}, {"id": "cw:ion-missing-words-of-s-not-in-subsequence-t", "topic": "Strings", "n": 60, "title": "Missing words of s not in subsequence t", "seenThisYear": false, "company": "ION", "source": "SDE Set 1, 15 July (HackerRank) · Drive", "statement": "Given sentences s and t (space separated words) where t is a subsequence of s's words, return the words of s that are missing in t, in order (case sensitive) (missingWords). Constraints: letters a-z, A-Z, '-' and spaces; 1&lt;=|t|&lt;=|s|&lt;=1e5; 1&lt;=word length&lt;=15; t is guaranteed a subsequence of s. Example: s='I like cheese', t='like' -&gt; ['I','cheese']; s='I am using HackerRank to improve programming', t='am HackerRank to improve' -&gt; ['I','using','programming'].", "tests": [{"label": "LC 392", "url": "https://leetcode.com/problems/is-subsequence/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "two pointers over words", "text": "Split both; walk s with pointer j into t, matching greedily; unmatched s words go to the answer. O(|s|)."}}, {"id": "cw:ion-max-perks-items-from-cartridges-and-dollars", "topic": "Maths", "n": 61, "title": "Max perks items from cartridges and dollars", "seenThisYear": false, "company": "ION", "source": "SDE Set 1, 15 July (HackerRank) · Drive", "statement": "cartridges, dollars, recycleReward, perksCost. Each perks item needs 1 cartridge plus perksCost dollars; any cartridge can instead be recycled for recycleReward dollars. Return the maximum number of perks items (maxPerksItems). Constraints: 1&lt;=all&lt;=1e9. Examples: (10,10,2,2) -&gt; 7 (recycle 3, then 7 items for 14 dollars); (4,8,3,4) -&gt; 2; (3,6,4,5) -&gt; 2. ⚠️ Statement says perksCost is 'in addition to recycling a single cartridge' wording; examples confirm the model above.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "binary search on answer", "text": "k items feasible iff k&lt;=cartridges and k*perksCost &lt;= dollars + (cartridges-k)*recycleReward; binary search k or k = min(c, (d + c*r)/(p + r)). O(log c), 64-bit."}}, {"id": "cw:kkr-co-level-order-traversal-of-binary-tree", "topic": "Graphs", "n": 62, "title": "Level order traversal of binary tree", "seenThisYear": false, "company": "KKR & Co.", "source": "Set 1 (OA, 45 min) · Drive", "statement": "Return the level order (BFS, level by level) traversal of a binary tree. Only the title was recorded; no input format, constraints or samples. ⚠️ Only a one-line description was recorded.", "tests": [{"label": "LC 102", "url": "https://leetcode.com/problems/binary-tree-level-order-traversal/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "BFS with queue", "text": "Queue-based BFS, process one level at a time. O(n)."}}, {"id": "cw:kkr-co-length-of-longest-palindrome-in-a-string", "topic": "Strings", "n": 63, "title": "Length of longest palindrome in a string", "seenThisYear": false, "company": "KKR & Co.", "source": "Set 1 (OA, 45 min) · Drive", "statement": "Given a string, return the length of the longest palindrome in it. Only a one-line description was recorded; no samples or constraints. ⚠️ ⚠️ Ambiguous: 'longest palindrome in given string' could be substring (LC 5) or buildable from letters (LC 409).", "tests": [{"label": "LC 5", "url": "https://leetcode.com/problems/longest-palindromic-substring/", "approx": false, "note": ""}, {"label": "LC 409", "url": "https://leetcode.com/problems/longest-palindrome/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "expand around center", "text": "If it means longest palindromic substring: expand around each of 2n-1 centers, O(n^2) (Manacher O(n)). If it means longest palindrome buildable from the letters: count pairs + 1 if any odd count."}}, {"id": "cw:kkr-co-split-array-into-two-halves-with-distinct-elements", "topic": "Arrays", "n": 64, "title": "Split array into two halves with distinct elements", "seenThisYear": false, "company": "KKR & Co.", "source": "Set 1 (OA, 45 min) · Drive", "statement": "Given an array (with duplicates), create, if possible, two arrays of equal size using all the elements so that neither array contains a duplicate. Output the two arrays, or [] if impossible. Examples: [2,3,2,4] -&gt; [2,3],[2,4]; [2,2,2,4] -&gt; []. ⚠️ Exact output format not specified beyond the examples.", "tests": [{"label": "LC 3046", "url": "https://leetcode.com/problems/split-the-array/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "frequency counting", "text": "Possible iff every value appears at most twice (and n is even). Put one copy of each duplicated value in each array, then distribute singletons to balance sizes. O(n)."}}, {"id": "cw:maq-software-twinkle-s-pythagorean-prime", "topic": "Maths", "n": 65, "title": "Twinkle's Pythagorean prime", "seenThisYear": false, "company": "MAQ Software", "source": "Set 1, 8 Sep 2025 (Talentdecrypt; screenshots from two candidates) · Drive", "statement": "T test cases (1&lt;=T&lt;=1e5), each an integer N (0&lt;=N&lt;=1e6). Print YES if N is a Pythagorean prime (a prime of the form 4n+1), else NO. Sample: T=2, N=5 -&gt; YES, N=8 -&gt; NO.", "tests": [{"label": "LC 204", "url": "https://leetcode.com/problems/count-primes/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "sieve + mod 4 check", "text": "Sieve primes up to 1e6 once; answer YES iff prime[N] and N%4==1. O(MAX log log MAX + T)."}}, {"id": "cw:maq-software-debate-points-fewest-picks-with-strictly-larger", "topic": "Arrays", "n": 66, "title": "Debate points: fewest picks with strictly larger sum", "seenThisYear": false, "company": "MAQ Software", "source": "Set 1, 8 Sep 2025 (Talentdecrypt; screenshots from two candidates) · Drive", "statement": "N points with strengths A_i. Karan picks a subset; he wins if the total of his picks is strictly greater than the total of the remaining points. Output the minimum number of points he must pick. Constraints: 1&lt;=N&lt;=1e5, 0&lt;=A_i&lt;=1e9. Sample: 5 / 6 3 4 1 2 -&gt; 2 (6+3=9 &gt; 7). ⚠️ If all A_i are 0 no subset is strictly greater; statement does not say what to print.", "tests": [{"label": "LC 1403", "url": "https://leetcode.com/problems/minimum-subsequence-in-non-increasing-order/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "sort descending greedy", "text": "Sort descending, take largest until taken*2 &gt; total. O(n log n), 64-bit."}}, {"id": "cw:maq-software-debate-on-reservation-system-fewest-points-to-w", "topic": "Arrays", "n": 67, "title": "Debate on Reservation System: fewest points to win", "seenThisYear": false, "company": "MAQ Software", "source": "OA (Talentdecrypt, 37 questions) · Drive", "statement": "N debate points have strengths A_i. Karan picks a subset first; Arjun gets the rest. Find the minimum number of points Karan must pick so that his total strength is strictly greater than the total of the remaining points. Input: N, then N integers. Output: minimum count. Constraints: 1 &lt;= N &lt;= 1e5, 0 &lt;= A_i &lt;= 1e9. Sample: 5 / 6 3 4 1 2 -&gt; 2 (6+3=9 &gt; 7). ⚠️ Behaviour when all strengths are 0 (no subset can win) is not specified.", "tests": [{"label": "LC 1403", "url": "https://leetcode.com/problems/minimum-subsequence-in-non-increasing-order/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "greedy sort descending", "text": "Sort descending, take largest elements until prefix sum &gt; total - prefix (use 64-bit). O(N log N)."}}, {"id": "cw:maq-software-make-that-a-palindrome-remove-t-chars-from-s", "topic": "Strings", "n": 68, "title": "Make that a Palindrome (remove T chars from S)", "seenThisYear": false, "company": "MAQ Software", "source": "OA (Talentdecrypt, 37 questions) · Drive", "statement": "Alice has string S, Bob has string T (lowercase). Remove from S the characters that also appear in T, matched by count (each character of T removes one occurrence from S if present), then check whether the remaining string can be rearranged into a palindrome. Input: TC, then for each test two lines S and T. Output YES/NO per test. Constraints: 1 &lt;= TC &lt;= 10, 1 &lt;= |S|,|T| &lt;= 1e4. Sample: S=abcdeeee, T=abceef -&gt; YES (remove a,b,c and two e's; 'f' is absent; remaining d,e,e -&gt; 'ede'). ⚠️ Right edge of the first statement line is cut off; the count-wise removal rule is inferred from the sample explanation.", "tests": [{"label": "LC 266 (Palindrome Permutation, premium)", "url": "https://leetcode.com/problems/palindrome-permutation/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "frequency count, odd-count check", "text": "cnt[c] = max(0, cntS[c] - cntT[c]); palindrome possible iff at most one character has an odd count. O(|S|+|T|)."}}, {"id": "cw:mathworks-minimum-digit-moves-to-match-arrays-i-want-to-be-l", "topic": "Implementation", "n": 69, "title": "Minimum digit moves to match arrays (I want to be like her)", "seenThisYear": false, "company": "MathWorks", "source": "OA set 1, 19 Aug (HackerRank, IIITDM Kancheepuram Masters, Signal Processing 2023-24) · Drive", "statement": "Q28. Given two arrays a and m of n integers each (a[i] and m[i] have the same number of digits). In one move you may increase or decrease a single digit of a number by 1 (e.g. 143 -&gt; 243 -&gt; 343 -&gt; 333 takes 3 moves). Return the minimum total number of moves to turn every a[i] into m[i]. Input: n, then n lines of a; n, then n lines of m. Constraints: 1 &lt;= n &lt;= 1e5, 1 &lt;= a[i], m[i] &lt;= 1e9. Sample: a=[1234,4321], m=[2345,3214] -&gt; 10 (4 moves for 1234-&gt;2345, 6 moves for 4321-&gt;3214). ⚠️ Answer can exceed int if all digits differ (1e5 <i> 9 </i> 9 = 8.1e6, fits int). Some screenshots are of the C/C++/Java stub only.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "digit-wise absolute difference", "text": "Digits change independently with no carry, so the answer is the sum over all i and digit positions of |digit(a[i]) - digit(m[i])|. O(n * digits)."}}, {"id": "cw:mathworks-merge-strings-alternately", "topic": "Strings", "n": 70, "title": "Merge strings alternately", "seenThisYear": false, "company": "MathWorks", "source": "OA set 1, 19 Aug (HackerRank, IIITDM Kancheepuram Masters, Signal Processing 2023-24) · Drive", "statement": "Q29. Given strings a and b, build a merged string by appending characters alternately from a and b; once one string is exhausted append the rest of the other. Constraints: 1 &lt;= |a|, |b| &lt;= 25000. Samples: a='abc', b='def' -&gt; 'adbecf'; a='ab', b='zsd' -&gt; 'azbsd'.", "tests": [{"label": "LC 1768", "url": "https://leetcode.com/problems/merge-strings-alternately/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "two pointers", "text": "Walk both strings with one index, appending a[i] then b[i] while they exist, then the tail. O(|a|+|b|)."}}, {"id": "cw:mathworks-star-removal-lexicographically-smallest-string", "topic": "Strings", "n": 71, "title": "Star removal: lexicographically smallest string", "seenThisYear": false, "company": "MathWorks", "source": "AMSS Selection Test 2025 (screenshot in the MathWorks set 1 folder) · Drive", "statement": "Q22 'Star Removal'. Given string A of lowercase letters and '<i>'. While there is a '</i>', delete the leftmost '<i>' and the smallest letter to its left (if several smallest letters, you may delete any of them). Return the lexicographically smallest string after all '</i>' are removed. Constraints: 1 &lt;= |A| &lt;= 1e5; input guarantees all '<i>' can be removed. Examples: 'aaba</i>' -&gt; 'aab'; 'abc' -&gt; 'abc'; 'aab*d*zd*' -&gt; 'dzd'. ⚠️ ⚠️ The header reads 'AMSS Selection Test 2025', so this may be from a different test than the MathWorks HackerRank OA.", "tests": [{"label": "LC 3170", "url": "https://leetcode.com/problems/lexicographically-minimum-string-after-removing-stars/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "greedy with per-letter stacks", "text": "Keep 26 stacks of indices; on '*' pop from the smallest non-empty letter's stack (its rightmost occurrence, which keeps the result smallest), then output unremoved letters in order. O(26n)."}}, {"id": "cw:media-net-double-box-outlay-ii-cheapest-two-disjoint-boxes", "topic": "Arrays", "n": 72, "title": "Double Box Outlay II: cheapest two disjoint boxes", "seenThisYear": false, "company": "Media.net", "source": "NIT Agartala - SDE Internship (InterviewBit, 3 questions); also seen in screenshots dated 30-07-2025 and 18-08-2025 · Drive", "statement": "There are N boxes; box i holds M distinct numbered cards A[i][0..M-1] and costs B[i]. Buy exactly two boxes that share no card number, at minimum total cost. Return that minimum total cost, or -1 if no pair of boxes is disjoint. Several boxes may have the same price, the same cards, or both. Function: int solve(vector&lt;vector&lt;int&gt;&gt; &amp;A, vector&lt;int&gt; &amp;B). Constraints: 2 &lt;= N &lt;= 10^4, 1 &lt;= M &lt;= 4, 1 &lt;= A[i][j], B[i] &lt;= 10^9. Sample 1: A = [[1,2,3],[3,4,5],[1,7,8],[10,11,13]], B = [1,2,3,5] -&gt; 5 (boxes [3,4,5] cost 2 and [1,7,8] cost 3). Sample 2: A = [[1,2],[2,3],[2,4]], B = [1,2,3] -&gt; -1 (every pair shares card 2). ⚠️ Output Format header is cut off in some shots; the q6/q8 shots show 'Return an integer denoting the required answer.'", "tests": [{"label": "CF 1641D", "url": "https://codeforces.com/problemset/problem/1641/D", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "inclusion-exclusion over subsets, two pointers", "text": "Sort boxes by cost. Store a hash map from each subset of a box's cards (2^M &lt;= 16 subsets) to a count, so the number of boxes in the current set that are disjoint from box x is an inclusion-exclusion sum over x's subsets. Grow a prefix until some box has a disjoint partner in it, then shrink and sweep with two pointers to find the cheapest pair. O(N <i> 2^M </i> hashing), same idea as CF 1641D."}}, {"id": "cw:media-net-a-lot-to-merge-kth-smallest-in-multiplication-tabl", "topic": "Maths", "n": 73, "title": "A lot to Merge: Kth smallest in multiplication table", "seenThisYear": false, "company": "Media.net", "source": "NIT Agartala - SDE Internship (InterviewBit); also in screenshots dated 30-07-2025 and 18-08-2025 · Drive", "statement": "Build an N x M matrix whose entry at row i, column j (1-indexed) is i*j. Sort all N*M entries in ascending order and return the K-th one. Function: int solve(int A, int B, int C), where A = N, B = M, C = K. Constraints: 1 &lt;= N, M &lt;= 10^4; 1 &lt;= K &lt;= N*M. Sample: N=2, M=2, K=2 -&gt; 2 (sorted list is 1,2,2,4). ⚠️ One blurry 'Wrong Answer' screenshot (q6 ..19.16.47_1_) seems to show a failing test like A:3, B:4, C:1?, returned 12, expected 13?; too blurry to trust. N*M can reach 10^8, which fits in int.", "tests": [{"label": "LC 668", "url": "https://leetcode.com/problems/kth-smallest-number-in-multiplication-table/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "binary search on answer", "text": "Binary search on the value x in [1, N*M]. The count of entries &lt;= x is sum over i of min(M, x / i). Return the smallest x whose count is &gt;= K. O(N log(NM))."}}, {"id": "cw:media-net-order-of-people-heights", "topic": "Arrays", "n": 74, "title": "Order of People Heights", "seenThisYear": false, "company": "Media.net", "source": "NIT Agartala - SDE Internship (InterviewBit) · Drive", "statement": "N people stand in a queue. You are given Heights (all distinct) and Infronts, where Infronts[i] is the number of people taller than person i who stand in front of them. Return the heights in their actual queue order. Function: vector&lt;int&gt; order(vector&lt;int&gt; &amp;A, vector&lt;int&gt; &amp;B), where A = heights and B = infronts. Sample: Heights = 5 3 2 6 1 4, Infronts = 0 1 2 0 3 2 -&gt; 5 3 2 1 6 4. ⚠️ Constraints are not shown in the screenshots.", "tests": [{"label": "LC 406", "url": "https://leetcode.com/problems/queue-reconstruction-by-height/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "sort + BIT k-th empty slot", "text": "Process people from shortest to tallest. Each person goes into the (Infronts+1)-th still-empty slot, because only taller people, placed later, fill the empty slots in front of them. Find that k-th empty slot with a Fenwick tree or segment tree descent. O(N log N), or O(N^2) with a plain list."}}, {"id": "cw:media-net-powerful-permutation-lexicographically-largest-pow", "topic": "Arrays", "n": 75, "title": "Powerful Permutation: lexicographically largest power array", "seenThisYear": false, "company": "Media.net", "source": "VIT - SDE Internship 2026 (6 months) and NIT Silchar - 2026 Internship (6 months) (InterviewBit) · Drive", "statement": "Given an integer array A of length N, choose any permutation P and form Z = [A[P1], ..., A[PN]]. The power array X has size 20: for 1 &lt;= i &lt;= 20, X[i] = the largest j such that every Z[k] with k &lt;= j has bit 2^(20-i) set (0 if Z[1] lacks that bit). Compare power arrays lexicographically and return the largest one any permutation can give, as a vector of 20 ints. Function: vector&lt;int&gt; solve(vector&lt;int&gt; &amp;A). Constraints: 1 &lt;= N &lt;= 2*10^5, 0 &lt;= A[i] &lt; 2^20. Sample 1: A = [1,2,3,4,5] -&gt; [0 x17, 2, 0, 1] (arrangement [5,4,3,2,1]). Sample 2: A = [4,16,16,36,36] -&gt; [0 x14, 2, 0, 0, 3, 0, 0] (arrangement [36,36,4,16,16]). ⚠️ X[i] uses bit 2^(20-i), so X[1] is bit 19 and X[20] is bit 0. The sample 2 input is labelled 'B = [4, 16, 16, 36, 36]' in the screenshot.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "greedy bit-by-bit group refinement", "text": "Keep the front of Z as an ordered list of groups (sets whose inner order is still free) plus a pool of unplaced elements. Go from bit 19 down to bit 0. Find the first group where not every element has the bit, move its bit-holders to the front of that group (splitting it), and set X = the size of the earlier groups plus the number of holders. If every group has the bit, add all pool elements that have it as a new group. O(20 N)."}}, {"id": "cw:media-net-help-your-master-2-sum-of-unreachable-multiples", "topic": "Graphs", "n": 76, "title": "Help Your Master 2: sum of unreachable multiples", "seenThisYear": false, "company": "Media.net", "source": "VIT - SDE Internship 2026 (6 months) and NIT Silchar - 2026 Internship (6 months) (InterviewBit) · Drive", "statement": "You are given an N x N matrix. Each cell is either -1 (blocked) or a positive value, and all unblocked values are distinct. You can move up, down, left or right between unblocked cells. For an unblocked cell with value v, its sed-value is the sum of all cell values that are multiples of v and NOT reachable from that cell. A blocked cell has sed-value -1. Return the sum of all sed-values modulo 1000000007. Function: int solve(vector&lt;vector&lt;int&gt;&gt; &amp;A). Constraints: 1 &lt;= N &lt;= 1e3; 1 &lt;= A[i][j] &lt;= 1e6; A[i][j] = -1 only for blocked cells. Sample 1: [[1,3,-1,5],[-1,-1,-1,-1],[2,6,-1,10],[8,7,-1,11]] -&gt; 68 (sed values: (0,0)=49, (0,1)=6, (0,3)=10, (2,0)=10, others 0, and 7 blocked cells give -1 each). Sample 2: [[1]] -&gt; 0. ⚠️ Sample 1 only adds up to 68 if each blocked cell's -1 is included in the sum.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "connected components + harmonic sieve", "text": "Label connected components with BFS or DSU and map each value to its component. For each present value v, walk its multiples 2v, 3v, ... up to 1e6 (a harmonic sum of about 1.4e7 steps) and add each present multiple whose component differs from v's. Add -1 for each blocked cell and take the result mod 1e9+7. O(N^2 + V log V)."}}, {"id": "cw:media-net-rainwater-harvesting-trapping-rain-water-in-2d", "topic": "Graphs", "n": 77, "title": "Rainwater Harvesting: trapping rain water in 2D", "seenThisYear": false, "company": "Media.net", "source": "NIT Silchar - 2026 Internship (6 Months) (InterviewBit) · Drive", "statement": "Given an N x M matrix of positive integers giving the height of each unit cell of a 2D elevation map, return the volume of water it can trap after raining. Function: int solve(vector&lt;vector&lt;int&gt;&gt; &amp;A). Constraints: 1 &lt;= N, M &lt;= 110; 1 &lt;= A[i] &lt;= 19999. Sample: A = [[1,4,3,1,3,2],[3,2,1,3,2,4],[2,3,3,2,3,1]] -&gt; 4.", "tests": [{"label": "LC 407", "url": "https://leetcode.com/problems/trapping-rain-water-ii/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "min-heap BFS from border", "text": "Push every border cell into a min-heap. Repeatedly pop the lowest cell; for each unvisited neighbour, add max(0, popped height - neighbour height) to the answer and push the neighbour with height max(own height, popped height). O(NM log NM)."}}, {"id": "cw:media-net-red-zone-first-day-b-circles-overlap", "topic": "Maths", "n": 78, "title": "Red Zone: first day B circles overlap", "seenThisYear": false, "company": "Media.net", "source": "NIT Delhi - SDE Internship - 2026 (6 months) (InterviewBit) · Drive", "statement": "N orange zones sit at integer points (A[i][0], A[i][1]) on an infinite 2D plane. After d days, every location within Euclidean distance d of an orange zone is affected by it. A location is a red zone if at least B orange zones affect it. Return the first day on which a red zone appears. Arguments: 2D array A (N points) and integer B. Constraints: 2 &lt;= B &lt;= N &lt;= 100; 0 &lt;= A[i][0], A[i][1] &lt;= 1e9. Sample 1: A = [[8,5],[0,4],[3,6]], B = 3 -&gt; 5. Sample 2: A = [[2,3],[9,4],[10,3]], B = 2 -&gt; 1. ⚠️ The screenshots show only Q1 of this NIT Delhi test; Q2 and Q3 are not shown.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "binary search + circle intersections", "text": "Binary search on the integer d. For a fixed d, the only candidate points for maximum coverage are the centres and the pairwise intersection points of the radius-d circles; check whether any candidate lies within distance d of at least B centres (use an epsilon). O(N^3 log C). Equivalently, find the smallest enclosing-circle radius over any B points and round it up."}}, {"id": "cw:media-net-maximize-positive-prefix-sums-after-rearranging", "topic": "Arrays", "n": 79, "title": "Maximize positive prefix sums after rearranging", "seenThisYear": false, "company": "Media.net", "source": "drive · Drive", "statement": "Given an integer array arr of size n that you may rearrange freely, let psum[i] = arr[0] + ... + arr[i]. Rearrange arr so that as many psum entries as possible are positive (&gt; 0) and return that maximum count. Function: int maxPosPrefixes(int arr[n]). Sample: n = 4, arr = [-6,3,4,-10] -&gt; 3 (arrangement [3,4,-6,-10] gives psum = [3,7,1,-9]). ⚠️ HackerRank-style test, Question 1 of 2. Constraints are not visible in the screenshot.", "tests": [{"label": "LC 2587", "url": "https://leetcode.com/problems/rearrange-array-to-maximize-prefix-score/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "greedy sort descending", "text": "Sort in descending order and count prefix sums that stay &gt; 0 (use 64-bit sums). O(n log n)."}}, {"id": "cw:media-net-sort-api-resources-by-dependency-level", "topic": "Strings", "n": 80, "title": "Sort API resources by dependency level", "seenThisYear": false, "company": "Media.net", "source": "drive · Drive", "statement": "Each request is a URL like \"https://api.example.com/resource1/id1/resource2/id2/resource3/id3\", which serves the resource \"resource1/resource2/resource3\" (a 3-level dependency): keep the resource names and drop the ids. Given n request strings, list the served resources: all 1-level ones first, then 2-level, and so on, with each level in lexicographic order (e.g. resource1 &lt; resource12 &lt; resource2). Every resource name has the form \"resource&lt;id&gt;\". Function: string[] getResourceList(string[] requests). Sample: n = 4, requests = [\"https://api.example.com/resource2/id/resource3/id2\", \"https://api.example.com/resource3/\", \"https://api.example.com/resource2/id\", \"https://api.example.com/resource1/id/resource3/id2\"] -&gt; [\"resource2\", \"resource3\", \"resource1/resource3\", \"resource2/resource3\"]. ⚠️ HackerRank-style test, Question 2 of 2. Constraints are not visible, and the statement does not say whether duplicate resources should be removed.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "string parsing + custom sort", "text": "Strip the domain prefix, split the path on '/', drop empty tokens, and keep the tokens at even positions (0, 2, 4, ...). Join them with '/' and record the level (number of names). Sort by (level, string). O(total length * log n)."}}, {"id": "cw:meesho-count-subarrays-with-given-max-and-min", "topic": "Arrays", "n": 81, "title": "Count subarrays with given max and min", "seenThisYear": false, "company": "Meesho", "source": "IIT KGP · Drive", "statement": "Given an array a of size n and values max_val and min_val, count subarrays whose maximum equals max_val and minimum equals min_val. Constraints: n &lt;= 1e5, a[i], max_val, min_val &lt;= 1e9. Example: a = [1,3,2,4,3], max_val = 4, min_val = 2 -&gt; 4.", "tests": [{"label": "LC 2444", "url": "https://leetcode.com/problems/count-subarrays-with-fixed-bounds/", "approx": false, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "sliding window / last positions", "text": "Scan once tracking last index of max_val, last index of min_val and last index of an out-of-range element; for each right end add max(0, min(lastMax,lastMin) - lastBad). O(n)."}}, {"id": "cw:meesho-max-profit-within-budget-n-up-to-36", "topic": "DP", "n": 82, "title": "Max profit within budget, n up to 36", "seenThisYear": false, "company": "Meesho", "source": "IIT KGP · Drive", "statement": "Given n items with cost[i] and profit[i], and max_budget, choose a subset with total cost &lt;= max_budget maximizing total profit. Constraints: n &lt;= 36, cost[i], profit[i] &lt;= 1e9. Example: cost = [2,3,1], profit = [4,5,2], max_budget = 4 -&gt; 6.", "tests": [{"label": "LC 1755", "url": "https://leetcode.com/problems/closest-subsequence-sum/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "meet in the middle", "text": "0/1 knapsack with huge weights: split into two halves of 18, enumerate subsets of each (cost, profit), sort one half by cost with prefix max of profit, and binary search the best partner for each subset of the other. O(2^(n/2) * n)."}}, {"id": "cw:meesho-points-earned-breaching-layers-from-each-start", "topic": "Arrays", "n": 83, "title": "Points earned breaching layers from each start", "seenThisYear": false, "company": "Meesho", "source": "IIT KGP · Drive", "statement": "Given arrays layers and energy of size n and initial energy k. Starting at index i with energy k, you move right: to breach layer j you need current energy &gt;= layers[j]; breaching reduces energy by layers[j], and if the remaining energy is &gt;= energy[j] you earn a point. You stop at the first layer you cannot breach (or the end). Output, for every start i, the points earned. Example: layer sYear": false, "company": "Pace Stock", "source": "OA · Drive", "statement": "Given a tree, return the number of unordered triplets of nodes that do not lie on one simple path, i.e. connecting them requires branching at some node. ⚠️ ⚠️ Recalled question: constraints, input format and modulus not given.", "tests": [], "kit": "", "kitReadme": "", "hint": {"group": "complement counting on tree", "text": "Answer = C(n,3) - (#triplets on one path). For each middle node v, triplets where v lies between the other two = sum over pairs of distinct branches of v of size_a*size_b (branches = child subtrees and the parent side): (S^2 - sum s_i^2)/2 with S = n-1. Subtracting these counts each collinear triplet exactly once. O(n)."}}, {"id": "cw:pace-stock-kth-largest-subarray-or-value", "topic": "Arrays", "n": 101, "title": "Kth largest subarray OR value", "seenThisYear": false, "company": "Pace Stock", "source": "OA · Drive", "statement": "Given an array of n &lt;= 1e5 integers, the value of a subarray is the bitwise OR of its elements. Among all n(n+1)/2 subarrays, find the k-th largest value (k &lt;= n(n+1)/2). ⚠️ Recalled question; no samples given.", "tests": [{"label": "LC 898", "url": "https://leetcode.com/problems/bitwise-ors-of-subarrays/", "approx": true, "note": ""}], "kit": "", "kitReadme": "", "hint": {"group": "OR distinct-values per endpoint", "text": "For each right end, the distinct OR values of subarrays ending there are at most ~30, each covering a contiguous block of left ends; collect (value, count) pairs (O(n log V)), sort by value descending and walk counts until k is reached. O(n log V log(n log V))."}}, {"id": "cw:paytm-lexicographically-maximum-string-after-removing-duplic", "topic": "Strings", "n": 102, "title": "Lexicographically maximum string after removing duplicates", "seenThisYear": false, "company": "Paytm", "source": "Set 1 · Drive", "statement": "Given a string input_str of length n. Repeatedly pick any character that occurs at least twice an
